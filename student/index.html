<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/images/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_INSTITUTE_NAME% - LMS</title>
    <!-- Apply persisted theme before first paint to prevent flash -->
    <script>
      try {
        if (localStorage.getItem('cga-theme') === 'dark') {
          document.documentElement.setAttribute('data-mode', 'dark')
          document.documentElement.classList.add('dark')
        }
        const p = localStorage.getItem('cga-palette')
        if (p && p !== 'blue') document.documentElement.setAttribute('data-colors', p)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
